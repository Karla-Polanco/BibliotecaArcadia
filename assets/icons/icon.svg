<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1829" />
      <stop offset="100%" stop-color="#0E0D17" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B6BF0" />
      <stop offset="100%" stop-color="#4F3FB8" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Glow Arc -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.35" />

  <!-- Book Base Pages Left and Right -->
  <g transform="translate(256, 260)">
    <!-- Shadow -->
    <path d="M-130,40 Q-70,-10 0,25 Q70,-10 130,40 L130,90 Q70,40 0,75 Q-70,40 -130,90 Z" fill="rgba(0,0,0,0.4)" />

    <!-- Left Page -->
    <path d="M0,15 C-45,-15 -100,-15 -140,25 L-140,95 C-100,55 -45,55 0,85 Z" fill="#E8E4F8" />
    <!-- Right Page -->
    <path d="M0,15 C45,-15 100,-15 140,25 L140,95 C100,55 45,55 0,85 Z" fill="#FFFFFF" />

    <!-- Spine Divider -->
    <path d="M-2,14 L-2,86 L2,86 L2,14 Z" fill="url(#primary-grad)" />

    <!-- Page lines left -->
    <line x1="-115" y1="42" x2="-30" y2="28" stroke="#CBC5EA" stroke-width="3" stroke-linecap="round" />
    <line x1="-115" y1="58" x2="-30" y2="44" stroke="#CBC5EA" stroke-width="3" stroke-linecap="round" />
    <line x1="-115" y1="74" x2="-50" y2="60" stroke="#CBC5EA" stroke-width="3" stroke-linecap="round" />

    <!-- Page lines right -->
    <line x1="30" y1="28" x2="115" y2="42" stroke="#DFDBF5" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="44" x2="115" y2="58" stroke="#DFDBF5" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="60" x2="95" y2="74" stroke="#DFDBF5" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Golden Celestial Star / Emblem Above Book -->
  <g transform="translate(256, 175)" filter="url(#glow)">
    <path d="M0,-36 L7,-11 L33,-11 L12,4 L19,30 L0,15 L-19,30 L-12,4 L-33,-11 L-7,-11 Z" fill="url(#gold-grad)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
</svg>
